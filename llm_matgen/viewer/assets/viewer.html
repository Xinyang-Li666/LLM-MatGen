<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM-MatGen · 结构查看</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18263b;font:15px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:6px 0}p{color:#586779;line-height:1.6}.tag{color:#076354;background:#dcefe9;padding:8px 14px;border-radius:20px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}select,button{font:inherit;border:1px solid #c8d1df;border-radius:7px;background:white;padding:9px 12px;cursor:pointer}select{max-width:100%;min-width:240px}button[aria-pressed=true]{background:#e1edea;border-color:#258573}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}.panel,aside{background:white;border:1px solid #dbe2eb;border-radius:12px;padding:16px}#canvas{position:relative;height:62vh;min-height:360px;background:white;overflow:hidden}.meta{overflow-wrap:anywhere;line-height:1.7}#selection{white-space:pre-wrap;max-height:35vh;overflow:auto}#error{color:#9a2424}label{display:inline-flex;gap:6px;align-items:center}#status{font-size:13px;color:#53677d}footer{font-size:13px;margin-top:14px;color:#607086}h2{font-size:16px}.legend{display:flex;flex-wrap:wrap;gap:12px;padding-top:12px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}@media(max-width:760px){main{padding:12px}.layout{grid-template-columns:1fr}#canvas{height:52vh}header{align-items:start}.tag{font-size:12px}}
</style></head><body><main>
<header><div><small>LLM-MatGen / STRUCTURE VIEWER</small><h1>结构查看</h1></div><span class="tag">球棍模型 · 初始构型</span></header>
<p>拖动旋转，滚轮缩放，右键拖动平移；点击原子查看编号与坐标。</p>
<div class="toolbar"><select id="candidate" aria-label="选择结构"></select><label><input id="labels" type="checkbox">原子编号</label><label><input id="cell" type="checkbox" checked>晶胞</label><button data-view="xy">XY</button><button data-view="xz">XZ</button><button data-view="yz">YZ</button><button id="reset">重置视角</button><button id="clear">清除选择</button></div>
<div id="error" role="alert" hidden></div><div class="layout"><section class="panel"><div id="status" aria-live="polite">正在载入</div><div id="canvas" role="img" aria-label="交互式球棍结构"></div><div id="legend" class="legend"></div></section><aside><h2>结构信息</h2><div id="metadata" class="meta"></div><h2>已选原子</h2><div id="selection" aria-live="polite">无</div><p>编号从 1 开始，对应生成结构中的原子顺序。固定原子会在详情中标注。</p></aside></div>
<footer>棍连接按共价半径估计，仅显示本晶胞内连接，不代表键级；跨周期边界的连接未绘制。可视化不替代数值检查和结构弛豫。渲染：3Dmol.js 2.0.4（BSD-3-Clause）。</footer>
<script id="structure-data" type="application/json">__STRUCTURE_DATA__</script>
<script>__RENDERER__</script>
<script>
(() => {'use strict';
const data=JSON.parse(document.getElementById('structure-data').textContent), $=id=>document.getElementById(id);
let viewer,entry,baseView,selected=new Set();
const colors={H:'#d0d0d0',C:'#50555e',N:'#305fe8',O:'#eb4242',F:'#4fbe63',Si:'#d8a16a',P:'#e6942c',S:'#d1b82a',Cl:'#43b351',Fe:'#c07846',Co:'#b36cb3',Ni:'#52a77b',Cu:'#ba7740',Pt:'#a1a9b6'};
const color=e=>colors[e]||'#849bc7';
function style(){viewer.setStyle({}, {sphere:{scale:.28},stick:{radius:.10}});viewer.removeAllLabels();
 const chosen=[...selected].sort((a,b)=>a-b);
 if(chosen.length)viewer.setStyle({index:chosen},{sphere:{scale:.39,color:'#edb133'},stick:{radius:.12}});
 entry.atoms.forEach((a,i)=>{if($('labels').checked||selected.has(i))viewer.addLabel(a.element+a.number,{position:{x:a.position[0],y:a.position[1],z:a.position[2]},fontColor:'#18263b',backgroundColor:'white',backgroundOpacity:.85,fontSize:12,inFront:true});});
 $('selection').textContent=chosen.length?chosen.map(i=>{const a=entry.atoms[i];return a.element+' '+a.number+'\n'+a.position.map(v=>v.toFixed(4)).join(', ')+' Å'+(a.fixed?'\n固定原子':'');}).join('\n\n'):'无';viewer.render();}
function cell(){viewer.removeAllShapes();if($('cell').checked){const c=entry.cell,point=(mask)=>{const p=[0,0,0];for(let i=0;i<3;i++)if(mask&(1<<i))for(let j=0;j<3;j++)p[j]+=c[i][j];return {x:p[0],y:p[1],z:p[2]};};for(let m=0;m<8;m++)for(let i=0;i<3;i++)if(!(m&(1<<i)))viewer.addLine({start:point(m),end:point(m|(1<<i)),color:'#9bacbf',linewidth:1.5});}viewer.render();}
function view(kind){viewer.setView(baseView);if(kind==='xz')viewer.rotate(90,'x');if(kind==='yz')viewer.rotate(90,'y');viewer.render();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===kind)));}
function load(){entry=data.entries[Number($('candidate').value)];selected=new Set();viewer.removeAllModels();viewer.removeAllLabels();viewer.removeAllShapes();const model=viewer.addModel();model.addAtoms(entry.atoms.map((a,i)=>({elem:a.element,x:a.position[0],y:a.position[1],z:a.position[2],serial:i+1,color:color(a.element),bonds:a.bonds,bondOrder:a.bonds.map(()=>1)})));viewer.setClickable({},true,a=>{if(selected.has(a.index))selected.delete(a.index);else selected.add(a.index);style();});viewer.setView([0,0,0,0,0,0,0,1]);viewer.zoomTo();baseView=viewer.getView().slice();style();cell();view('xy');$('status').textContent=entry.label+' · '+entry.atoms.length+' 个原子';$('metadata').textContent=entry.formula+' | '+entry.atoms.length+' 个原子';$('legend').replaceChildren();[...new Set(entry.atoms.map(a=>a.element))].forEach(e=>{const item=document.createElement('span'),dot=document.createElement('span');dot.className='dot';dot.style.background=color(e);item.append(dot,document.createTextNode(e));$('legend').append(item);});}
try{if(!window.$3Dmol)throw Error('渲染组件未载入');viewer=$3Dmol.createViewer($('canvas'),{backgroundColor:'white',antialias:true});data.entries.forEach((e,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=e.label;$('candidate').append(o);});$('candidate').onchange=load;$('labels').onchange=style;$('cell').onchange=cell;$('clear').onclick=()=>{selected.clear();style();};$('reset').onclick=()=>view('xy');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));window.addEventListener('resize',()=>{viewer.resize();viewer.render();});load();document.body.dataset.viewerReady='true';}catch(e){$('error').hidden=false;$('error').textContent='无法显示三维结构：'+e.message+'。请使用支持 WebGL 的浏览器。';$('status').textContent='载入失败';}
})();
</script></main></body></html>
