name: test

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,fps]"
      - name: Run tracked tests
        run: python -m pytest --import-mode=importlib -q
      - name: Compile package
        run: python -m compileall -q llm_matgen integrations
      - name: Check patch whitespace
        run: git diff --check
